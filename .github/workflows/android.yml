name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validation gate
        run: node scripts/validate-project.js
      - name: Unit tests (17 suites)
        run: node tests/run-all.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (www/)
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK (unsigned)
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify build output
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          echo "APK sizes:"
          ls -la android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Rename artifacts
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/LingoStep-v9.0.0-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apks/LingoStep-v9.0.0-release-unsigned.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoStep-debug-apk
          path: apks/LingoStep-v9.0.0-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoStep-release-apk-unsigned
          path: apks/LingoStep-v9.0.0-release-unsigned.apk
          if-no-files-found: error

      - name: Publish GitHub Release (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.0.0
          name: LingoStep v9.0.0
          body: |
            LingoStep v9.0.0 — premium Android app build.

            ## Install
            1. Download **LingoStep-v9.0.0-debug.apk** below.
            2. On your phone, allow "Install unknown apps" for your browser/file manager.
            3. Open the APK and install.

            The release APK is unsigned — for daily use install the debug APK.
          files: |
            apks/LingoStep-v9.0.0-debug.apk
            apks/LingoStep-v9.0.0-release-unsigned.apk
